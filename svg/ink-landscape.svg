<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f0e6" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f5f0e6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5f0e6" stop-opacity="0"/>
    </radialGradient>
    <filter id="bleed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="softbleed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- 明月 -->
  <circle cx="285" cy="70" r="55" fill="url(#moonGlow)"/>
  <circle cx="285" cy="70" r="26" fill="#f5f0e6" opacity="0.9"/>

  <!-- 远山（晕染） -->
  <g filter="url(#softbleed)" opacity="0.25">
    <path d="M0 150 Q 60 110 120 140 T 240 130 T 360 145 L360 200 L0 200 Z" fill="#1a1a1a"/>
  </g>
  <!-- 中景山 -->
  <g filter="url(#bleed)" opacity="0.4">
    <path d="M0 175 Q 80 140 160 165 T 360 160 L360 230 L0 230 Z" fill="#2c2c2c"/>
  </g>
  <!-- 近山 -->
  <g opacity="0.7">
    <path d="M0 205 Q 70 180 150 200 T 360 195 L360 260 L0 260 Z" fill="#1a1a1a"/>
  </g>

  <!-- 雾气 -->
  <ellipse cx="120" cy="180" rx="90" ry="9" fill="#f7f1e3" opacity="0.5" filter="url(#bleed)"/>
  <ellipse cx="270" cy="195" rx="80" ry="8" fill="#f7f1e3" opacity="0.45" filter="url(#bleed)"/>

  <!-- 孤舟 -->
  <g opacity="0.85">
    <path d="M150 235 Q 165 230 180 235 L178 240 Q 165 237 152 240 Z" fill="#1a1a1a"/>
    <line x1="165" y1="235" x2="165" y2="218" stroke="#1a1a1a" stroke-width="1.2"/>
    <path d="M165 218 Q 178 214 186 220 Q 176 222 165 218 Z" fill="#1a1a1a"/>
  </g>

  <!-- 飞鸟 -->
  <path d="M70 80 Q 75 76 80 80 Q 85 76 90 80" stroke="#1a1a1a" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M110 60 Q 114 57 118 60 Q 122 57 126 60" stroke="#1a1a1a" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- 竖题 -->
  <text x="28" y="62" fill="#1a1a1a" opacity="0.55" font-size="20" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif">山</text>
  <text x="28" y="90" fill="#1a1a1a" opacity="0.55" font-size="20" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif">水</text>
  <text x="28" y="118" fill="#1a1a1a" opacity="0.55" font-size="20" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif">之</text>
  <text x="28" y="146" fill="#1a1a1a" opacity="0.55" font-size="20" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif">间</text>

  <!-- 朱砂印 -->
  <rect x="300" y="225" width="34" height="34" fill="#a83232" rx="2" opacity="0.9"/>
  <text x="317" y="247" text-anchor="middle" fill="#f5f0e6" font-size="14" font-family="STFangsong, FangSong, 仿宋, serif" font-weight="bold">墨</text>
</svg>

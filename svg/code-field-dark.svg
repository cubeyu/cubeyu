<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200">
  <!-- 深色底 -->
  <rect width="360" height="200" fill="#1a1a1a"/>

  <!-- 金线边框 -->
  <rect x="2" y="2" width="356" height="196" fill="none" stroke="#c9b88a" stroke-width="1"/>

  <!-- 标题 -->
  <text x="180" y="32" text-anchor="middle" fill="#ede0c6" font-size="20" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif" font-weight="bold" letter-spacing="3">— 代码田 —</text>

  <!-- 副标题 -->
  <text x="180" y="58" text-anchor="middle" fill="#b8a888" font-size="12" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif" font-style="italic">墨痕三千九百,日耕不辍</text>

  <!-- 三个数据 -->
  <text x="60" y="115" text-anchor="middle" fill="#ede0c6" font-size="36" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif" font-weight="bold">390</text>
  <text x="60" y="140" text-anchor="middle" fill="#b8a888" font-size="11" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif" letter-spacing="2">累计提交</text>

  <text x="180" y="115" text-anchor="middle" fill="#d8534a" font-size="36" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif" font-weight="bold">4</text>
  <text x="180" y="140" text-anchor="middle" fill="#b8a888" font-size="11" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif" letter-spacing="2">当前连续</text>

  <text x="300" y="115" text-anchor="middle" fill="#ede0c6" font-size="36" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif" font-weight="bold">5</text>
  <text x="300" y="140" text-anchor="middle" fill="#b8a888" font-size="11" font-family="STKaiti, KaiTi, 楷体, STFangsong, FangSong, 仿宋, serif" letter-spacing="2">最长连续</text>

  <!-- 底部朱砂印 -->
  <rect x="318" y="168" width="32" height="24" fill="#a83232" opacity="0.9" rx="2"/>
  <text x="334" y="186" text-anchor="middle" fill="#f5f0e6" font-size="12" font-family="STFangsong, FangSong, 仿宋, serif" font-weight="bold">耕</text>
</svg>

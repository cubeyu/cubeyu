name: 更新 GitHub 图表和贪吃蛇动画

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 主分支
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Clone output 分支到临时目录
        run: |
          git clone --single-branch --branch output https://github.com/${{ github.repository }} output-dir

      - name: 生成 GitHub Metrics 图表
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          user: cubeyu
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_isocalendar: yes

      - name: 移动 Metrics 文件到 output 目录
        run: mv metrics.svg output-dir/

      - name: 生成贪吃蛇图（Snake）
        uses: Platane/snk@v3
        with:
          github_user_name: cubeyu
          outputs: |
            output-dir/snake.svg

      - name: 提交到 output 分支
        run: |
          cd output-dir
          git config --global user.name "cubeyu-bot"
          git config --global user.email "cubeyu@users.noreply.github.com"
          git add .
          git commit -m "📈 自动更新 Metrics & Snake 图表" || echo "Nothing to commit"
          git push origin output